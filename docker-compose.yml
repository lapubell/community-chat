services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: community-chat:latest
    container_name: community-chat
    # The host port is configurable via PORT in a .env file (default 8983).
    ports:
      - "${PORT:-8983}:8983"
    environment:
      - PORT=8983
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - FRONTEND_DIR=/app/frontend_dist
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
    volumes:
      - chat-data:/app/data
      - chat-uploads:/app/uploads
    restart: unless-stopped

volumes:
  chat-data:
  chat-uploads:
