services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Short git SHA shown in the app footer. Computed on the host at build
        # time (see README / deploy notes). Falls back to "unknown".
        APP_GIT_HASH: ${APP_GIT_HASH:-unknown}
    image: community-chat:latest
    container_name: community-chat
    # The host port is configurable via PORT in a .env file (default 8983).
    ports:
      - "${PORT:-8983}:8983"
    environment:
      - PORT=8983
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - FRONTEND_DIR=/app/frontend_dist
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      # Web Push (VAPID) — optional; push is disabled without these.
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_EMAIL=${VAPID_EMAIL:-mailto:admin@example.com}
      # Public origin of the site, used as the VAPID audience / deep-link base.
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:8983}
    volumes:
      # The SQLite DB lives in the project root under ./data so it's easy to
      # find and inspect (e.g. open ./data/chat.db). Bind-mounted at /app/data
      # inside the container (DATA_DIR). The container runs as uid 1000
      # (appuser), so the file must be owned/writable by uid 1000 — on most
      # hosts that's your normal user.
      - ./data:/app/data
      # Uploaded files (avatars, message attachments) live in ./uploads at the
      # project root so they're easy to find/inspect. Bind-mounted at
      # /app/uploads (UPLOAD_DIR). Same uid-1000 ownership note as ./data.
      - ./uploads:/app/uploads
    restart: unless-stopped
